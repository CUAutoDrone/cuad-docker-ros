name: ci-pr-dispatched

on:
    workflow_dispatch:


jobs:

  docker-pr-validate:
    uses: docker/github-builder/.github/workflows/bake.yml@02ccc51e26beaa9507db1f2a0103f3d9c8c1c16a # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      runner: |
        default=ubuntu-latest
        linux/arm64=ubuntu-26.04-arm
      cache: true
      cache-mode: max
      output: image
      push: true
      sbom: true
      source-date-epoch: commit
      target: validate-build
      set-meta-annotations: true
      set-meta-labels: true
      set: |
        default.tags=ghcr.io/cuautodrone/cuad-ros:test

  docker-pr:
    needs: 
      - docker-pr-validate
    uses: docker/github-builder/.github/workflows/bake.yml@02ccc51e26beaa9507db1f2a0103f3d9c8c1c16a # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      runner: |
        default=ubuntu-latest
        linux/arm64=ubuntu-26.04-arm
      cache: true
      cache-mode: max
      output: image
      push: true
      sbom: true
      source-date-epoch: commit
      target: default
      set-meta-annotations: true
      set-meta-labels: true
      set: |
        default.tags=ghcr.io/cuautodrone/cuad-ros:test

  docker-pr-scout:
    needs: 
      - docker-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Scout AMD64
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with: 
          command: quickview,cves,recommendations,compare
          image: ghcr.io/cuautodrone/cuad-ros:test
          to: ghcr.io/cuautodrone/cuad-ros:latest
          platform: linux/amd64
          only-fixed: true

      - name: Scout ARM64
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with: 
          command: quickview,cves,recommendations,compare
          image: ghcr.io/cuautodrone/cuad-ros:test
          to: ghcr.io/cuautodrone/cuad-ros:latest
          platform: linux/arm64
          only-fixed: true