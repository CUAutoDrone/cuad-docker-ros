name: ci-merge

on:
    workflow_dispatch

env:
    IMAGE_NAME: ghcr.io/cuautodrone/cuad-ros
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    docker-merge:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          packages: write
          pull-requests: write
          security-events: write
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set Up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set Up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Push Image to GitHub Container Registry
              run: |
                docker buildx imagetools create \
                --tag ghcr.io/cuautodrone/cuad-ros:latest \
                ghcr.io/cuautodrone/cuad-ros:test

            - name: Scout AMD64
              uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
              with: 
                command: quickview,cves,recommendations
                image: ghcr.io/cuautodrone/cuad-ros:latest
                platform: linux/amd64
                sarif-file: sarif.amd64.output.json
                only-fixed: true

            - name: Scout ARM64
              uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
              with: 
                command: quickview,cves,recommendations
                image: ghcr.io/cuautodrone/cuad-ros:latest
                platform: linux/arm64
                sarif-file: sarif.arm64.output.json
                only-fixed: true

            - name: Merge PR
              run: git pull --all && gh pr merge -md

            - name: Get Branch Info
              id: branch-info
              run: |
                echo "ref=$(git symbolic-ref HEAD)" >>${GITHUB_OUTPUT}
                echo "sha=$(git rev-parse HEAD)" >>${GITHUB_OUTPUT}

            - name: Upload SARIF Results AMD64
              id: upload-sarif-amd64
              uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                sarif_file: sarif.amd64.output.json
                category: amd64
                ref: ${{ steps.branch-info.outputs.ref }}
                sha: ${{ steps.branch-info.outputs.sha }}

            - name: Upload SARIF Results ARM64
              id: upload-sarif-arm64
              uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                sarif_file: sarif.arm64.output.json
                category: arm64
                ref: ${{ steps.branch-info.outputs.ref }}
                sha: ${{ steps.branch-info.outputs.sha }}