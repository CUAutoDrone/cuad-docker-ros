name: ci-merge

on:
    workflow_dispatch

env:
    IMAGE_NAME: ghcr.io/cuautodrone/cuad-ros
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    docker-merge:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          packages: write
          pull-requests: write
          security-events: write
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set Up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            - name: Set Up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Push Image to GitHub Container Registry
              run: |
                docker buildx imagetools create \
                --tag ghcr.io/cuautodrone/cuad-ros:latest \
                ghcr.io/cuautodrone/cuad-ros:test

            - name: Scout AMD64
              uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
              with: 
                command: quickview,cves,recommendations
                image: ghcr.io/cuautodrone/cuad-ros:latest
                platform: linux/amd64
                sarif-file: sarif.amd64.output.json
                only-fixed: true

            - name: Scout ARM64
              uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
              with: 
                command: quickview,cves,recommendations
                image: ghcr.io/cuautodrone/cuad-ros:latest
                platform: linux/arm64
                sarif-file: sarif.arm64.output.json
                only-fixed: true

            - name: Merge PR
              run: git pull --all && gh pr merge -md

            - name: Get Branch Info
              id: branch-info
              run: |
                echo "ref=$(git symbolic-ref HEAD)" >>${GITHUB_OUTPUT}
                echo "sha=$(git rev-parse HEAD)" >>${GITHUB_OUTPUT}

            - name: Upload SARIF Results AMD64
              id: upload-sarif-amd64
              uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
              with:
                sarif_file: sarif.amd64.output.json
                category: amd64
                ref: ${{ steps.branch-info.outputs.ref }}
                sha: ${{ steps.branch-info.outputs.sha }}

            - name: Upload SARIF Results ARM64
              id: upload-sarif-arm64
              uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
              with:
                sarif_file: sarif.arm64.output.json
                category: arm64
                ref: ${{ steps.branch-info.outputs.ref }}
                sha: ${{ steps.branch-info.outputs.sha }}