name: ci-pr

on:
  pull_request:

env:
  IMAGE_NAME: ghcr.io/cuautodrone/cuad-ros:latest

jobs:
  build-wxpython-arm-wheel:
    runs-on: ubuntu-24.04-arm
    permissions: {}

    steps:
      - name: Download wxpython Tarball
        run: pip download -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxpython

      - name: Extract Tarball
        run: mkdir wxpython && tar xzf wxpython*.tar.gz -C wxpython --strip-components=1

      - name: Install Python Dependencies
        run: cd wxpython && python -m pip install --upgrade pip && python -m pip install --upgrade --group codegen

      - name: Install Ubuntu Dependencies
        run: cd wxpython && ./buildtools/install_depends.sh
      
      - name: Build wxpython Wheel
        run: |
          mkdir wxpython-src
          tar xzf wxpython*.tar.gz -C wxpython-src --strip-components=1
          pip install build
          WXPYTHON_BUILD_ARGS="--release" python -m build --wheel --verbose --outdir . ./wxpython-src

      - name: Upload wxpython Wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wxpython-arm-wheel
          path: ./*.whl

  docker-pr:
    needs: 
      - build-wxpython-arm-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wxpython Wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wxpython-arm-wheel

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

      - name: Upload meta bake defintion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bake-meta
          path: ${{ runner.temp }}/bake-meta.json
          if-no-files-found: error
          retention-days: 30