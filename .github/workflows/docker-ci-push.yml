name: ci-push

on:
  push:
    branches:
      - main

jobs:
  preset-variables:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image-name: ${{ steps.preset-env-vars.outputs.IMAGE_NAME }}
      latest-tag: ${{ steps.preset-env-vars.outputs.LATEST_TAG }}
      main-tag: ${{ steps.preset-env-vars.outputs.MAIN_TAG }}
      ros-apt-source-version: ${{ steps.get-ros-apt-source-version.outputs.ROS_APT_SOURCE_VERSION }}
    steps:
      - name: Preset Environment Variables
        id: preset-env-vars
        run: |
          echo "IMAGE_NAME=ghcr.io/cuautodrone/cuad-ros" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=latest" >> $GITHUB_OUTPUT
          echo "MAIN_TAG=main" >> $GITHUB_OUTPUT

      - name: Get ROS Apt Source Version
        id: get-ros-apt-source-version
        run: echo "ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F\" '{print $4}')" >> $GITHUB_OUTPUT

  docker-push-validate:
    needs:
      - preset-variables
    uses: docker/github-builder/.github/workflows/bake.yml@c19d2479fb16086aabea31f7dadca583513925f3 # v1
    permissions:
      contents: read
      id-token: write
    with:
      runner: |
        default=ubuntu-latest
        linux/arm64=ubuntu-26.04-arm
      cache: true
      cache-mode: max
      output: image
      source-date-epoch: commit
      target: validate-build
      set-meta-annotations: true
      set-meta-labels: true
      meta-images: ${{ needs.preset-variables.outputs.image-name }}
      meta-tags: ${{ needs.preset-variables.outputs.main-tag }}
      set: default.args.ROS_APT_SOURCE_VERSION=${{ needs.preset-variables.outputs.ros-apt-source-version }}

  docker-push:
    needs: 
      - preset-variables
      - docker-push-validate
    uses: docker/github-builder/.github/workflows/bake.yml@c19d2479fb16086aabea31f7dadca583513925f3 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      runner: |
        default=ubuntu-latest
        linux/arm64=ubuntu-26.04-arm
      cache: true
      cache-mode: max
      output: image
      push: true
      sbom: true
      source-date-epoch: commit
      target: default
      set-meta-annotations: true
      set-meta-labels: true
      meta-images: ${{ needs.preset-variables.outputs.image-name }}
      meta-tags: ${{ needs.preset-variables.outputs.main-tag }}
      set: default.args.ROS_APT_SOURCE_VERSION=${{ needs.preset-variables.outputs.ros-apt-source-version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-push-scout:
    needs: 
      - preset-variables
      - docker-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Scout AMD64
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with: 
          command: quickview,cves,recommendations,compare
          image: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.main-tag }}
          to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
          platform: linux/amd64
          only-fixed: true

      - name: Scout ARM64
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with: 
          command: quickview,cves,recommendations,compare
          image: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.main-tag }}
          to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
          platform: linux/arm64
          only-fixed: true