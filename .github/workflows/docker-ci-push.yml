name: ci-push

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/cuautodrone/cuad-ros:main

jobs:
  build-wxpython-arm-wheel:
    runs-on: ubuntu-24.04-arm
    permissions: {}

    steps:
      - name: Download wxpython Tarball
        run: pip download -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxpython

      - name: Extract Tarball
        run: mkdir wxpython && tar xzf wxpython*.tar.gz -C wxpython --strip-components=1

      - name: Install Python Dependencies
        run: cd wxpython && python -m pip install --upgrade pip && python -m pip install --upgrade --group codegen

      - name: Install Ubuntu Dependencies
        run: cd wxpython && ./buildtools/install_depends.sh
      
      - name: Build wxpython Wheel
        run: |
          mkdir wxpython-src
          tar xzf wxpython*.tar.gz -C wxpython-src --strip-components=1
          pip install build
          WXPYTHON_BUILD_ARGS="--release" python -m build --wheel --verbose --outdir . ./wxpython-src

      - name: Upload wxpython Wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wxpython-arm-wheel
          path: ./*.whl

  docker-push:
    needs: 
      - build-wxpython-arm-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Up Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          docker-images: false
          
      - name: Clean Old Package Config
        run: sudo apt purge -y '~c'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Download wxpython Wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wxpython-arm-wheel

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Get ROS Apt Source Version
        run: echo "ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F\" '{print $4}')" >> $GITHUB_ENV

      - name: Validate Build Configuration
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          targets: validate-build
          set: "default.args.ROS_APT_SOURCE_VERSION=${{ env.ROS_APT_SOURCE_VERSION }}"
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: default
          set: |
            default.args.ROS_APT_SOURCE_VERSION=${{ env.ROS_APT_SOURCE_VERSION }}
            default.tags=${{ env.IMAGE_NAME }}
          push: true
          provenance: true
          sbom: true
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Scout AMD64
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with: 
          command: quickview,cves,recommendations,compare
          image: ghcr.io/cuautodrone/cuad-ros:main
          to: ghcr.io/cuautodrone/cuad-ros:latest
          platform: linux/amd64
          only-fixed: true

      - name: Scout ARM64
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with: 
          command: quickview,cves,recommendations,compare
          image: ghcr.io/cuautodrone/cuad-ros:main
          to: ghcr.io/cuautodrone/cuad-ros:latest
          platform: linux/arm64
          only-fixed: true